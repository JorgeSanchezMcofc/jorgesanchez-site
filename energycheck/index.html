<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2F36">
<title>Energy Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --deep:#0D2F36; --deep2:#11404A; --deep3:#175260;
  --foam:#EEF6F3; --mist:#9DBDB8; --line:rgba(238,246,243,.14);
  --mint:#7FE0C3; --mint-d:#3FBF9C; --amber:#FFC45C; --coral:#FF8A6B;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--deep);color:var(--foam);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 50% -10%, #17505A 0, transparent 60%)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.05}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 48px;min-height:100vh;display:flex;flex-direction:column}
.muted{color:var(--mist)}
.err{color:var(--coral);font-size:15px;min-height:22px;margin-top:10px}
.ok{color:var(--mint);font-weight:700;margin-top:10px}

/* ---------- the bucket ---------- */
.vessel{display:block;overflow:visible}
.vessel .shell{fill:rgba(238,246,243,.06);stroke:var(--foam);stroke-width:3;stroke-linejoin:round}
.vessel .handle{fill:none;stroke:var(--foam);stroke-width:3;stroke-linecap:round}
.vessel .lvl{transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.vessel .w1{fill:var(--mint);animation:drift 3.2s linear infinite}
.vessel .w2{fill:var(--mint-d);opacity:.65;animation:drift 5s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}

/* ---------- inputs ---------- */
label{display:block;font-weight:600;margin:20px 0 8px}
input{width:100%;font:inherit;font-size:19px;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(238,246,243,.06);color:var(--foam)}
input::placeholder{color:#6F8F8B}
input:focus{outline:none;border-color:var(--mint)}
#code{text-transform:uppercase;letter-spacing:.35em;font-family:var(--display);font-weight:800;font-size:28px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:24px;padding:17px;border:0;border-radius:16px;
  background:var(--mint);color:var(--deep);font-weight:800;font-family:var(--display);font-size:20px;cursor:pointer;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.quiet{background:transparent;color:var(--foam);border:2px solid var(--line);font-size:16px;padding:12px}

/* ---------- join ---------- */
.joinhero{display:flex;align-items:flex-end;gap:14px;margin:18px 0 6px}
.joinhero h1{font-size:46px;font-weight:800}
.joinhero .vessel{flex:none}

/* ---------- question ---------- */
.qtop{display:flex;align-items:center;gap:14px}
.qtop .count{font-family:var(--display);font-weight:700;font-size:15px;color:var(--mist)}
.qprompt{font-size:32px;font-weight:800;margin:26px 0 20px}
.choices{display:grid;gap:12px;flex:1;align-content:start}
.choice{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;text-align:left;min-height:120px;padding:22px;border-radius:22px;
  border:2px solid var(--line);background:var(--deep2);font-size:22px;font-weight:600;line-height:1.2;cursor:pointer;transition:border-color .2s,transform .12s}
.choice:hover{border-color:var(--mist)}
.choice:active{transform:scale(.985)}
.choice .ic{font-size:42px;line-height:1;position:relative;z-index:1}
.choice .tx{position:relative;z-index:1}
.choice::before{content:"";position:absolute;inset:0;background:var(--mint);transform:translateY(101%);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.choice.sel{color:var(--deep);border-color:var(--mint)}
.choice.sel::before{transform:none}
.or{text-align:center;font-family:var(--display);font-weight:700;color:var(--mist);font-size:15px}
.back{background:none;border:0;color:var(--mist);text-decoration:underline;cursor:pointer;padding:16px 0;align-self:flex-start;font-size:15px}

/* ---------- results ---------- */
.reshead{text-align:center;padding:10px 0 6px}
.reshead .vessel{margin:0 auto 8px}
.reshead h1{font-size:36px;font-weight:800}
.reshead p{margin:10px auto 0;max-width:34ch}
.block{margin-top:34px}
.block h2{font-size:24px;margin-bottom:14px}
.lean{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:10px;margin:12px 0;font-size:15px;color:var(--mist)}
.lean .l{text-align:right}
.lean .won{color:var(--foam);font-weight:700}
.track{position:relative;height:10px;border-radius:99px;background:rgba(238,246,243,.1)}
.track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--line)}
.track i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px rgba(127,224,195,.2);transition:left .9s cubic-bezier(.3,.9,.3,1)}
.tip{padding:14px 0 14px 18px;border-left:4px solid var(--mint);margin-bottom:12px}
.tip.cost{border-color:var(--coral)}
.tip b{display:block;font-family:var(--display);font-size:20px;margin-bottom:3px}
.tip span{color:var(--mist);font-size:16px}
.note{font-size:14px;color:var(--mist);text-align:center;margin-top:28px}

/* ---------- host ---------- */
.host{display:grid;grid-template-columns:330px 1fr;gap:28px;padding:28px;min-height:100vh}
.side{display:flex;flex-direction:column;gap:18px}
.joinbox{background:var(--foam);color:var(--deep);border-radius:26px;padding:24px;text-align:center}
.joinbox .lbl{font-weight:600;font-size:15px}
.roomcode{font-family:var(--display);font-weight:800;font-size:72px;letter-spacing:.08em;line-height:1;margin:6px 0 12px}
#qr{display:flex;justify-content:center}
#qr img,#qr canvas{border-radius:8px}
.joinurl{font-size:13px;margin-top:10px;word-break:break-all;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:99px;background:var(--deep2);border:1px solid var(--line);font-size:15px;animation:popin .45s cubic-bezier(.3,1.4,.5,1) both}
.chip.done{background:var(--mint);color:var(--deep);border-color:var(--mint);font-weight:600}
@keyframes popin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.stage{position:relative;background:var(--deep2);border-radius:30px;padding:30px 34px;display:flex;flex-direction:column;overflow:hidden}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stagebar h2{font-size:40px;font-weight:800}
.ctrls{display:flex;gap:10px;align-items:center}
.ctrls .btn{width:auto;margin:0;padding:12px 22px;font-size:17px}
.tabs{display:flex;background:rgba(0,0,0,.2);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--mist)}
.tabs button.on{background:var(--foam);color:var(--deep)}
.waiting{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;flex-wrap:wrap}
.waiting .big{font-family:var(--display);font-weight:800;font-size:120px;line-height:.9}
.waiting .big small{font-size:44px;color:var(--mist)}
.bubbles{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;gap:14px;padding:24px 0}
.bub{display:flex;align-items:center;justify-content:center;text-align:center;border-radius:50%;padding:10px;font-family:var(--display);font-weight:800;line-height:1.02;
  color:var(--deep);animation:rise .9s cubic-bezier(.3,1.3,.5,1) both, bob 6s ease-in-out infinite}
.bub small{display:block;font-family:var(--body);font-weight:700;font-size:.55em;opacity:.7;margin-top:2px}
@keyframes rise{from{transform:translateY(140px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
.splits{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px 0}
.split{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;font-size:17px}
.split .l{text-align:right}
.split > div:first-child,.split > div:last-child{white-space:nowrap}
.split b{font-family:var(--display);font-size:22px;margin:0 6px}
.split .bar{display:flex;height:24px;border-radius:99px;overflow:hidden;background:rgba(0,0,0,.2)}
.split .a{background:var(--mint);transition:width 1.1s cubic-bezier(.3,.9,.3,1)}
.split .b{background:var(--amber);transition:width 1.1s cubic-bezier(.3,.9,.3,1)}
.foot{font-size:14px;color:var(--mist);text-align:center}
.demo{position:fixed;bottom:12px;left:12px;pointer-events:none;max-width:300px;font-size:12px;background:var(--amber);color:var(--deep);padding:6px 12px;border-radius:99px;font-weight:600}
@media (max-width:980px){.host{grid-template-columns:1fr}.waiting .big{font-size:84px}}
@media (max-width:380px){.joinhero h1{font-size:38px}.qprompt{font-size:27px}.choice{font-size:19px;min-height:100px}.lean{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- participant: join -->
<section id="join" class="view wrap" hidden>
  <div class="joinhero">
    <h1>What fills your bucket?</h1>
    <div id="joinVessel"></div>
  </div>
  <p class="muted">14 quick this-or-that picks about what recharges you. No right answers. Your picks stay private.</p>
  <label for="code">Room code</label>
  <input id="code" maxlength="4" autocomplete="off" placeholder="ABCD">
  <label for="name">First name</label>
  <input id="name" maxlength="30" autocomplete="given-name" placeholder="Your first name">
  <button class="btn" id="joinBtn">Start</button>
  <div class="err" id="joinErr" role="alert"></div>
</section>

<!-- participant: question -->
<section id="q" class="view wrap" hidden>
  <div class="qtop"><div id="qVessel"></div><div class="count" id="qcount"></div></div>
  <h2 class="qprompt">Which recharges you more?</h2>
  <div id="qbody" class="choices"></div>
  <button class="back" id="backBtn">Back</button>
</section>

<!-- participant: results -->
<section id="res" class="view wrap" hidden><div id="resBody"></div></section>

<!-- host -->
<section id="host" class="view" hidden>
  <div class="host">
    <div class="side">
      <div class="joinbox">
        <div class="lbl">Scan or go to the link</div>
        <div class="roomcode" id="hCode">····</div>
        <div id="qr"></div>
        <div class="joinurl" id="hUrl"></div>
      </div>
      <div class="chips" id="hChips"></div>
      <button class="btn quiet" id="newRoom" style="margin-top:auto">Start a new room</button>
    </div>
    <div class="stage">
      <div class="stagebar">
        <h2>What recharges us</h2>
        <div class="ctrls">
          <div class="tabs" id="tabs" hidden><button data-t="cloud" class="on">Bubbles</button><button data-t="splits">This or that</button></div>
          <button class="btn" id="revealBtn">Reveal results</button>
        </div>
      </div>
      <div id="hResults" style="flex:1;display:flex;flex-direction:column"></div>
    </div>
  </div>
</section>

<div class="demo" id="demoTag" hidden>Demo mode: syncs only between tabs in this browser.</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyAw_gYeCi4JiEiGWD6Xbkry0R2Aw64pezE",
    authDomain: "energy-check-f3fd2.firebaseapp.com",
    databaseURL: "https://energy-check-f3fd2-default-rtdb.firebaseio.com",
    projectId: "energy-check-f3fd2",
    appId: "1:682502644058:web:781bfaf3827fdb65d5d363"
  },
  emailjs: {
    publicKey: "",
    serviceId: "",
    templateId: ""
  }
};

/* =========================================================
   CONTENT
   Each dimension has two poles (a = left, b = right).
   Each pair belongs to a dimension; choosing "a" leans toward pole a.
   ========================================================= */
const DIMS = [
  {k:"social",    a:{k:"people",  name:"People"},   b:{k:"solitude", name:"Solitude"}},
  {k:"depth",     a:{k:"deep",    name:"Depth"},    b:{k:"variety",  name:"Variety"}},
  {k:"stim",      a:{k:"buzz",    name:"Buzz"},     b:{k:"calm",     name:"Calm"}},
  {k:"pace",      a:{k:"doing",   name:"Doing"},    b:{k:"resting",  name:"Resting"}},
  {k:"structure", a:{k:"plan",    name:"Planning"}, b:{k:"open",     name:"Spontaneity"}},
  {k:"novelty",   a:{k:"new",     name:"Novelty"},  b:{k:"familiar", name:"Familiarity"}},
  {k:"mode",      a:{k:"body",    name:"Body"},     b:{k:"mind",     name:"Mind"}}
];
const PAIRS = [
  {id:"p1",  d:"social",    a:{t:"A night out with friends",   ic:"🎉", w:"Nights out"},       b:{t:"A quiet night at home",   ic:"🛋️", w:"Quiet nights"}},
  {id:"p2",  d:"depth",     a:{t:"One long conversation",      ic:"☕", w:"Long talks"},       b:{t:"Lots of quick catch-ups", ic:"💬", w:"Quick catch-ups"}},
  {id:"p3",  d:"stim",      a:{t:"A lively coffee shop",       ic:"🎶", w:"Lively spaces"},    b:{t:"A quiet room",            ic:"🕯️", w:"Quiet rooms"}},
  {id:"p4",  d:"pace",      a:{t:"Crossing things off a list", ic:"✅", w:"Checklists"},       b:{t:"Doing nothing on purpose",ic:"🌙", w:"Doing nothing"}},
  {id:"p5",  d:"structure", a:{t:"A planned day",              ic:"🗓️", w:"Planned days"},     b:{t:"An open day",             ic:"🌀", w:"Open days"}},
  {id:"p6",  d:"novelty",   a:{t:"A new restaurant",           ic:"🍜", w:"New places"},       b:{t:"Your favorite spot",      ic:"⭐", w:"Favorite spots"}},
  {id:"p7",  d:"mode",      a:{t:"A hard workout",             ic:"🏋️", w:"Workouts"},         b:{t:"A good book",             ic:"📖", w:"Books"}},
  {id:"p8",  d:"social",    a:{t:"Lunch with the team",        ic:"🍱", w:"Team lunches"},     b:{t:"Lunch on your own",       ic:"🥪", w:"Solo lunches"}},
  {id:"p9",  d:"depth",     a:{t:"Time with close friends",    ic:"🫂", w:"Close friends"},    b:{t:"Meeting new people",      ic:"👋", w:"New people"}},
  {id:"p10", d:"stim",      a:{t:"A packed weekend",           ic:"📅", w:"Packed weekends"},  b:{t:"An empty weekend",        ic:"🌤️", w:"Empty weekends"}},
  {id:"p11", d:"pace",      a:{t:"Finishing a project",        ic:"🏁", w:"Finishing things"}, b:{t:"Taking a long nap",       ic:"😴", w:"Naps"}},
  {id:"p12", d:"structure", a:{t:"Knowing the agenda",         ic:"📋", w:"Agendas"},          b:{t:"Figuring it out as you go",ic:"🧭", w:"Winging it"}},
  {id:"p13", d:"novelty",   a:{t:"Learning something new",     ic:"📚", w:"Learning"},         b:{t:"Getting better at something you know", ic:"🎯", w:"Mastery"}},
  {id:"p14", d:"mode",      a:{t:"Working with your hands",    ic:"🛠️", w:"Hands-on work"},    b:{t:"Working through an idea", ic:"💡", w:"Big ideas"}}
];
const POLE = {
  people:  {ic:"🎉", more:"Put one plan with people on the calendar this week, even a short coffee.",
                     cost:"Time with people takes more out of you than it seems. After big social days like this week, protect quiet time to recover."},
  solitude:{ic:"🌙", more:"Block 30 minutes alone this week. No agenda, phone in another room.",
                     cost:"Long stretches alone wear you down. When you're on the road, line up a call or a meal with someone."},
  deep:    {ic:"☕", more:"Schedule one unhurried conversation with someone you trust.",
                     cost:"Long, heavy conversations take a lot. Keep some light, quick ones in the mix."},
  variety: {ic:"👋", more:"Say yes to one event where you'll meet new people.",
                     cost:"Lots of short interactions can scatter you. Leave space between them."},
  buzz:    {ic:"🎶", more:"Work from somewhere with some energy and noise once this week.",
                     cost:"Busy, noisy places cost you. Find your quiet corner before you need it."},
  calm:    {ic:"🕯️", more:"Protect a quiet space for yourself, even 20 minutes a day.",
                     cost:"Too much quiet can leave you flat. Add music, people, or a change of scene."},
  doing:   {ic:"✅", more:"Pick one meaningful thing to finish this week and enjoy checking it off.",
                     cost:"Nonstop output drains you. Put rest on the calendar like a meeting."},
  resting: {ic:"😴", more:"Plan real rest: one evening this week with nothing scheduled.",
                     cost:"Pure downtime can make you restless. Try active rest: a walk, a hobby, a small project."},
  plan:    {ic:"🗓️", more:"Plan tomorrow tonight. Knowing what's coming frees up energy.",
                     cost:"Rigid schedules box you in. Leave some open space in your week."},
  open:    {ic:"🧭", more:"Leave one block in your week completely open.",
                     cost:"Uncertainty costs you. Ask for agendas and plan ahead where you can."},
  new:     {ic:"📚", more:"Try one new thing this week: a place, a route, a skill.",
                     cost:"Too much new at once wears you out. Keep a few familiar anchors."},
  familiar:{ic:"⭐", more:"Go back to a favorite place, ritual, or person this week.",
                     cost:"Too much routine can dull you. Change one small thing."},
  body:    {ic:"🏋️", more:"Move your body three times this week, even a 20-minute walk counts.",
                     cost:"Hard physical effort isn't your recharge right now. Keep movement gentle and enjoyable."},
  mind:    {ic:"📖", more:"Give yourself an hour with a good book, idea, or puzzle.",
                     cost:"Heavy thinking drains you. Get out of your head and into your body."}
};
// Interleave so the two pairs of each dimension are far apart
const ORDER = PAIRS;

/* =========================================================
   STORE (Firebase or local demo)
   ========================================================= */
const USE_FB = !!CONFIG.firebase.databaseURL;
let db = null;
if (USE_FB) { firebase.initializeApp(Object.fromEntries(Object.entries(CONFIG.firebase).filter(([k,v])=>v))); db = firebase.database(); }
const EMAIL_ON = !!(CONFIG.emailjs.publicKey && CONFIG.emailjs.serviceId && CONFIG.emailjs.templateId);
if (EMAIL_ON) emailjs.init({publicKey: CONFIG.emailjs.publicKey});

const local = {
  key:c=>"energy_room_"+c,
  read(c){ try{ return JSON.parse(localStorage.getItem(this.key(c))) }catch(e){ return null } },
  write(c,v){ try{ localStorage.setItem(this.key(c), JSON.stringify(v)) }catch(e){} }
};
const listeners = {};
const store = {
  async createRoom(c){
    if (USE_FB) return db.ref(`rooms/${c}/meta`).set({created:Date.now()});
    local.write(c,{meta:{created:Date.now()},people:{}});
  },
  async roomExists(c){
    if (USE_FB) return (await db.ref(`rooms/${c}/meta`).once("value")).exists();
    return !!local.read(c);
  },
  async upsert(c,id,data){
    if (USE_FB) return db.ref(`rooms/${c}/people/${id}`).update(data);
    const r = local.read(c) || {meta:{},people:{}};
    r.people[id] = Object.assign(r.people[id]||{}, data);
    local.write(c,r);
    (listeners[c]||[]).forEach(f=>f(r.people));
  },
  watch(c,cb){
    if (USE_FB) return db.ref(`rooms/${c}/people`).on("value", s=>cb(s.val()||{}));
    (listeners[c] = listeners[c]||[]).push(cb);
    cb((local.read(c)||{}).people||{});
    window.addEventListener("storage", e=>{ if(e.key===local.key(c)) cb((local.read(c)||{}).people||{}) });
  }
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function show(id){ document.querySelectorAll(".view").forEach(v=>v.hidden = v.id!==id); window.scrollTo(0,0); }
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function genCode(){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
const joinUrl = c=>location.origin+location.pathname+"?room="+c;
const dimOf = k=>DIMS.find(d=>d.k===k);

// score per dimension: -2 (fully pole a) .. +2 (fully pole b)
function analyze(ans){
  const scores = {};
  DIMS.forEach(d=>scores[d.k]=0);
  PAIRS.forEach(p=>{ if(ans[p.id]) scores[p.d] += ans[p.id]==="a" ? -1 : 1; });
  const leanings = DIMS.map(d=>{
    const s = scores[d.k];
    return {dim:d, s, strength:Math.abs(s), pole: s<0? d.a : s>0? d.b : null, opp: s<0? d.b : s>0? d.a : null};
  }).filter(x=>x.pole).sort((x,y)=>y.strength-x.strength || DIMS.indexOf(x.dim)-DIMS.indexOf(y.dim));
  let more = leanings.filter(x=>x.strength===2);
  if (more.length<3) more = leanings.slice(0,3);
  more = more.slice(0,4);
  const recover = leanings.slice(0,2);
  return {scores, more, recover};
}

/* =========================================================
   THE BUCKET (SVG with moving water)
   ========================================================= */
const WAVE = (()=>{ let d="M0 0"; for(let x=0;x<480;x+=60) d+=` Q${x+15} -7 ${x+30} 0 T${x+60} 0`; return d+" V200 H0 Z"; })();
let vesselN = 0;
function vessel(size, pct){
  const id = "v"+(++vesselN);
  return `<svg class="vessel" id="${id}" width="${size}" height="${size*1.12}" viewBox="0 -12 120 160" aria-hidden="true">
    <defs><clipPath id="${id}c"><path d="M12 22 H108 L97 128 Q96 136 88 136 H32 Q24 136 23 128 Z"/></clipPath></defs>
    <path class="handle" d="M16 26 Q60 -26 104 26"/>
    <path class="shell" d="M12 22 H108 L97 128 Q96 136 88 136 H32 Q24 136 23 128 Z"/>
    <g clip-path="url(#${id}c)"><g class="lvl" style="transform:translateY(${lvlY(pct)}px)">
      <path class="w2" d="${WAVE}" transform="translate(-30 2)"/><path class="w1" d="${WAVE}"/></g></g>
  </svg>`;
}
const lvlY = pct=>136 - Math.max(0,Math.min(.92,pct))*118;
function fill(id, pct){ const g=document.querySelector(`#${id} .lvl`); if(g) g.style.transform=`translateY(${lvlY(pct)}px)`; }

/* =========================================================
   PARTICIPANT FLOW
   ========================================================= */
let S = null;
let qVesselId = null;

async function join(){
  const code = $("#code").value.trim().toUpperCase();
  const name = $("#name").value.trim();
  const err = $("#joinErr"); err.textContent="";
  if (code.length!==4) return err.textContent="Enter the 4-letter room code from the screen.";
  if (!name) return err.textContent="Add your first name.";
  $("#joinBtn").disabled = true;
  try{
    if (USE_FB && !(await store.roomExists(code))) { err.textContent="No room with that code. Check the screen and try again."; return; }
    const flip = {}; PAIRS.forEach(p=>flip[p.id]=Math.random()<.5);
    S = {code, name, id:uid(), i:0, ans:{}, flip};
    await store.upsert(code, S.id, {name, done:false, t:Date.now()});
    $("#qVessel").innerHTML = vessel(52, .04); qVesselId = "v"+vesselN;
    renderQ(); show("q");
  }catch(e){ err.textContent="Couldn't reach the room. Check your connection and try again."; console.error(e); }
  finally{ $("#joinBtn").disabled=false; }
}

function renderQ(){
  const p = ORDER[S.i];
  $("#qcount").textContent = `${S.i+1} of ${ORDER.length}`;
  fill(qVesselId, .04 + S.i/ORDER.length*.96);
  $("#backBtn").style.visibility = S.i? "visible":"hidden";
  const sides = S.flip[p.id] ? ["b","a"] : ["a","b"];
  const btn = side=>`<button class="choice ${S.ans[p.id]===side?"sel":""}" data-s="${side}"><span class="ic">${p[side].ic}</span><span class="tx">${p[side].t}</span></button>`;
  $("#qbody").innerHTML = `${btn(sides[0])}<div class="or">or</div>${btn(sides[1])}`;
  let locked = false;
  $("#qbody").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if (locked) return; locked = true;
    S.ans[p.id] = b.dataset.s; b.classList.add("sel");
    if (navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    setTimeout(()=>{ S.i++; S.i<ORDER.length ? renderQ() : finish(); }, 380);
  });
}

async function finish(){
  fill(qVesselId, 1);
  S.result = analyze(S.ans);
  try{ await store.upsert(S.code, S.id, {answers:S.ans, done:true}); }catch(e){ console.error(e); }
  renderResults(); show("res");
}

function headline(r){
  const top = r.more.slice(0,2).map(x=>x.pole.name);
  if (!top.length) return "You recharge in lots of ways";
  return `You recharge through ${top.join(" and ")}`;
}

function reportText(){
  const r=S.result;
  return `Hi ${S.name},\n\n${headline(r)}.\n\nDO MORE OF\n`+
    r.more.map(x=>`- ${x.pole.name}: ${POLE[x.pole.k].more}`).join("\n")+
    (r.recover.length? `\n\nPLAN RECOVERY AROUND\n`+r.recover.map(x=>`- ${x.opp.name}: ${POLE[x.opp.k].cost}`).join("\n") : "")+
    `\n\nPick one "do more" and try it before next Friday. A sustainable pace beats a heroic one.\n`;
}
function reportHtml(){
  const r=S.result;
  const li=(t,d,c)=>`<div style="border-left:4px solid ${c};padding:6px 0 6px 14px;margin:10px 0"><b>${esc(t)}</b><br><span style="color:#55706C">${esc(d)}</span></div>`;
  return `<div style="font-family:Arial,sans-serif;color:#0D2F36;max-width:520px">
  <div style="background:#0D2F36;color:#EEF6F3;border-radius:16px;padding:22px;text-align:center">
    <div style="font-size:14px;color:#7FE0C3">Your energy check-in</div>
    <div style="font-size:24px;font-weight:bold;margin-top:6px">${esc(headline(r))}</div></div>
  <p>Hi ${esc(S.name)}, here are your reminders.</p>
  <h3 style="margin-bottom:4px">Do more of</h3>${r.more.map(x=>li(x.pole.name,POLE[x.pole.k].more,"#3FBF9C")).join("")}
  ${r.recover.length?`<h3 style="margin:18px 0 4px">Plan recovery around</h3>${r.recover.map(x=>li(x.opp.name,POLE[x.opp.k].cost,"#FF8A6B")).join("")}`:""}
  <p style="margin-top:18px">Pick one "do more" and try it before next Friday. A sustainable pace beats a heroic one.</p></div>`;
}

function renderResults(){
  const r=S.result;
  $("#resBody").innerHTML = `
    <div class="reshead">${vessel(110, 1)}<h1>${headline(r)}</h1>
      <p class="muted">Neither side is better. This is where your energy comes from right now.</p></div>
    <div class="block"><h2>Where you lean</h2>
      ${DIMS.map(d=>{const s=r.scores[d.k];return `<div class="lean"><div class="l ${s<0?"won":""}">${d.a.name}</div><div class="track"><i data-x="${50+s*23}" style="left:50%"></i></div><div class="${s>0?"won":""}">${d.b.name}</div></div>`}).join("")}</div>
    <div class="block"><h2>Do more of</h2>
      ${r.more.length? r.more.map(x=>`<div class="tip"><b>${POLE[x.pole.k].ic} ${x.pole.name}</b><span>${POLE[x.pole.k].more}</span></div>`).join("")
        : `<p class="muted">You land in the middle on everything. Notice day to day which side you need.</p>`}</div>
    ${r.recover.length?`<div class="block"><h2>Plan recovery around</h2>
      ${r.recover.map(x=>`<div class="tip cost"><b>${POLE[x.opp.k].ic} ${x.opp.name}</b><span>${POLE[x.opp.k].cost}</span></div>`).join("")}</div>`:""}
    <div class="block"><h2>Email yourself these reminders</h2>
      <p class="muted" style="margin-top:0">We don't store your email.</p>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <button class="btn" id="sendBtn">Email my reminders</button>
      <div id="sendMsg" class="err" role="status"></div></div>
    <p class="note">Look up at the screen to see what recharges the room.</p>`;
  $("#sendBtn").onclick = sendEmail;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".track i").forEach(i=>i.style.left=i.dataset.x+"%")));
}

async function sendEmail(){
  const to = $("#email").value.trim(), msg=$("#sendMsg");
  msg.className="err"; msg.textContent="";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return msg.textContent="That email doesn't look complete. Check it and try again.";
  if (!EMAIL_ON){
    location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent("My energy check-in reminders")}&body=${encodeURIComponent(reportText())}`;
    return;
  }
  $("#sendBtn").disabled=true; $("#sendBtn").textContent="Sending...";
  try{
    await emailjs.send(CONFIG.emailjs.serviceId, CONFIG.emailjs.templateId, {
      to_email:to, to_name:S.name, profile:headline(S.result),
      report_text:reportText(), report_html:reportHtml()
    });
    msg.className="ok"; msg.textContent="Sent. Check your inbox, and spam just in case.";
    $("#sendBtn").textContent="Sent";
  }catch(e){
    console.error(e); msg.textContent="The email didn't go through. Try again in a moment.";
    $("#sendBtn").disabled=false; $("#sendBtn").textContent="Email my reminders";
  }
}

/* =========================================================
   HOST FLOW
   ========================================================= */
let H = {code:null, people:{}, revealed:false, tab:"cloud", vid:null};

async function hostInit(){
  let code = null;
  try{ code = localStorage.getItem("energy_host_room"); }catch(e){}
  if (!code || !(await store.roomExists(code))) code = await newRoom(false);
  openRoom(code);
}
async function newRoom(open=true){
  const code = genCode();
  await store.createRoom(code);
  try{ localStorage.setItem("energy_host_room", code); }catch(e){}
  if (open) openRoom(code);
  return code;
}
function openRoom(code){
  H = {code, people:{}, revealed:false, tab:H.tab||"cloud", vid:null};
  $("#hCode").textContent = code;
  $("#hUrl").textContent = joinUrl(code).replace(/^https?:\/\//,"");
  $("#qr").innerHTML="";
  try{ new QRCode($("#qr"), {text:joinUrl(code), width:230, height:230, colorDark:"#0D2F36", colorLight:"#EEF6F3"}); }
  catch(e){ $("#qr").innerHTML = `<p>Share the link below to join.</p>`; }
  $("#revealBtn").textContent="Reveal results"; $("#tabs").hidden = true;
  store.watch(code, p=>{ if(H.code===code){ H.people=p; renderHost(); } });
  renderHost();
}

function seeded(str){ let h=7; for(const c of str) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }

function renderHost(){
  const ppl = Object.values(H.people||{}).sort((a,b)=>(a.t||0)-(b.t||0));
  const done = ppl.filter(p=>p.done && p.answers);
  $("#hChips").innerHTML = ppl.map(p=>`<span class="chip ${p.done?"done":""}">${esc(p.name||"")}</span>`).join("");
  const R = $("#hResults");

  if (!H.revealed){
    const pct = ppl.length? done.length/ppl.length : 0;
    if (!H.vid || !document.getElementById(H.vid)){
      R.innerHTML = `<div class="waiting"><div id="hv"></div><div><div class="big" id="hNum"></div>
        <p class="muted" id="hMsg" style="font-size:20px;max-width:22ch"></p></div></div>`;
      $("#hv").innerHTML = vessel(260, pct); H.vid = "v"+vesselN;
    }
    fill(H.vid, ppl.length ? Math.max(.05,pct) : 0);
    $("#hNum").innerHTML = `${done.length}<small> / ${ppl.length}</small>`;
    $("#hMsg").textContent = !ppl.length ? "Scan the code to jump in." :
      done.length===ppl.length ? "Everyone's done. Ready when you are." : "buckets filled so far";
    return;
  }
  H.vid = null;
  if (!done.length){ R.innerHTML = `<div class="waiting"><p class="muted" style="font-size:22px">Nobody has finished yet. Results show up as people finish.</p></div>`; return; }

  const counts = {};
  PAIRS.forEach(p=>counts[p.id]={a:0,b:0});
  done.forEach(u=>PAIRS.forEach(p=>{ const v=u.answers[p.id]; if(v==="a"||v==="b") counts[p.id][v]++; }));

  if (H.tab==="cloud"){
    const words = [];
    PAIRS.forEach(p=>["a","b"].forEach(s=>{ const n=counts[p.id][s]; if(n) words.push({w:p[s].w, ic:p[s].ic, n}); }));
    const max = Math.max(...words.map(x=>x.n));
    // shrink bubbles so they always fit the stage
    const box = R.getBoundingClientRect();
    const W = Math.max(600, box.width), Hh = Math.max(360, box.height - 40);
    const raw = words.map(x=>78 + Math.pow(x.n/max,.9)*150);
    const k = Math.min(1, Math.sqrt(.5*W*Hh / raw.reduce((a,d)=>a+(d+14)*(d+14),0)));
    const fills = ["#7FE0C3","#FFC45C","#A9D8F5","#FF8A6B","#C9B8F2","#EEF6F3"];
    words.sort((x,y)=> (seeded(x.w)%101) - (seeded(y.w)%101));
    R.innerHTML = `<div class="bubbles">${words.map((x,i)=>{
      const r = x.n/max, d = Math.round((78 + Math.pow(r,.9)*150)*k), fs = Math.round((13 + r*17)*Math.max(.75,k));
      return `<div class="bub" title="${x.n} people" style="width:${d}px;height:${d}px;font-size:${fs}px;background:${fills[seeded(x.w)%fills.length]};animation-delay:${i*55}ms, ${(seeded(x.w)%40)/10}s">
        <div>${x.ic}<br>${esc(x.w)}<small>${x.n}</small></div></div>`;
    }).join("")}</div><p class="foot">Bigger bubble, more people picked it. ${done.length} ${done.length===1?"person":"people"} so far.</p>`;
  } else {
    R.innerHTML = `<div class="splits">${PAIRS.map(p=>{
      const c=counts[p.id], tot=c.a+c.b||1, pa=Math.round(c.a/tot*100), pb=100-pa;
      return `<div class="split"><div class="l">${p.a.ic} ${esc(p.a.w)}<b>${pa}%</b></div>
        <div class="bar"><div class="a" data-w="${pa}" style="width:50%"></div><div class="b" data-w="${pb}" style="width:50%"></div></div>
        <div><b>${pb}%</b>${esc(p.b.w)} ${p.b.ic}</div></div>`;
    }).join("")}</div><p class="foot">${done.length} ${done.length===1?"person":"people"}. Individual answers are never shown.</p>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>R.querySelectorAll(".bar div").forEach(f=>f.style.width=f.dataset.w+"%")));
  }
}

/* =========================================================
   ROUTING
   ========================================================= */
if (location.hash === "#host"){
  if (!USE_FB) $("#demoTag").hidden = false;
  show("host");
  $("#revealBtn").onclick = ()=>{
    H.revealed=!H.revealed;
    $("#revealBtn").textContent = H.revealed?"Hide results":"Reveal results";
    $("#tabs").hidden = !H.revealed;
    renderHost();
  };
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    H.tab=b.dataset.t;
    $("#tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    renderHost();
  });
  $("#newRoom").onclick = ()=>newRoom(true);
  hostInit();
} else {
  show("join");
  $("#joinVessel").innerHTML = vessel(64, .45);
  const rc = new URLSearchParams(location.search).get("room");
  if (rc){ $("#code").value = rc.toUpperCase(); $("#name").focus(); }
  $("#joinBtn").onclick = join;
  $("#backBtn").onclick = ()=>{ if (S && S.i>0){ S.i--; renderQ(); } };
  ["#code","#name"].forEach(s=>$(s).addEventListener("keydown",e=>{ if(e.key==="Enter") join(); }));
}
</script>
</body>
</html>
