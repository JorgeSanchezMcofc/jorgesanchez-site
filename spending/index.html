<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spending Tracker — Jorge Sanchez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f8f6;
      --surface: #ffffff;
      --surface-2: #f2f1ee;
      --border: rgba(0,0,0,0.09);
      --border-strong: rgba(0,0,0,0.15);
      --text: #0b0b0b;
      --text-2: #52514e;
      --text-3: #898781;
      --accent: #2a78d6;
      --accent-bg: #e6f1fb;
      --accent-text: #0c447c;
      --danger: #e34948;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --success: #1baf7a;
      --success-bg: #e1f5ee;
      --success-text: #0f6e56;
      --warning-bg: #faeeda;
      --warning-text: #854f0b;
      --radius: 8px;
      --card-radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--text-3); font-weight: 400; }

    .refresh-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: transparent; border: 0.5px solid var(--border-strong);
      border-radius: var(--radius); cursor: pointer; font-size: 13px;
      font-family: 'Inter', sans-serif; color: var(--text-2);
      transition: background .15s;
    }
    .refresh-btn:hover { background: var(--surface-2); }
    .refresh-btn.loading { opacity: .6; cursor: default; }

    .status-pill {
      font-size: 11px; padding: 3px 10px; border-radius: 20px;
      background: var(--accent-bg); color: var(--accent-text);
    }
    .status-pill.error { background: var(--danger-bg); color: var(--danger-text); }

    nav {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex; gap: 4px;
    }

    .nav-btn {
      padding: 12px 16px; background: transparent; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      font-size: 13px; font-family: 'Inter', sans-serif;
      color: var(--text-3); display: flex; align-items: center; gap: 6px;
      transition: color .15s;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; }

    .pane { display: none; }
    .pane.active { display: block; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--card-radius); padding: 1rem 1.25rem; }
    .stat-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.5rem; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--card-radius); padding: 1.25rem; }
    .card-title { font-size: 13px; font-weight: 500; margin-bottom: 1rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bar-label { font-size: 12px; color: var(--text-2); width: 100px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    .bar-track { flex: 1; background: var(--surface-2); border-radius: 4px; height: 22px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; min-width: 50px; transition: width .4s ease; }
    .bar-amount { font-size: 11px; color: #fff; font-weight: 500; white-space: nowrap; }

    .tx-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--card-radius); overflow: hidden; }
    .tx-header { padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .tx-header h3 { font-size: 13px; font-weight: 500; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 16px; color: var(--text-3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 0.5px solid var(--border); background: var(--surface-2); }
    td { padding: 10px 16px; border-bottom: 0.5px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
    .badge.transfers { background: var(--warning-bg); color: var(--warning-text); }
    .badge.restaurants { background: var(--success-bg); color: var(--success-text); }
    .badge.retail { background: #f0efec; color: #5f5e5a; }
    .badge.entertainment { background: #f3effe; color: #4a3aa7; }

    .amount-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
    .debit-cell { color: var(--danger); }

    /* Loans */
    .loans-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .loans-summary { font-size: 13px; color: var(--text-2); }
    .btn { padding: 8px 16px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
    .btn:hover { background: var(--surface-2); }
    .btn-danger { color: var(--danger); border-color: var(--border); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    .loan-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--card-radius); padding: 1.25rem; margin-bottom: 10px; }
    .loan-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .loan-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .loan-meta { font-size: 12px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .status-pendiente { background: var(--danger-bg); color: var(--danger-text); }
    .status-parcial { background: var(--warning-bg); color: var(--warning-text); }
    .status-pagado { background: var(--success-bg); color: var(--success-text); }

    .form-card { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--card-radius); padding: 1.25rem; margin-bottom: 1rem; }
    .form-card h3 { font-size: 14px; font-weight: 500; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
    .form-group label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; border-radius: var(--radius);
      border: 0.5px solid var(--border-strong); background: var(--bg);
      color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,.12); }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Chat */
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 180px); max-height: 680px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--card-radius); overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
    .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-radius: 12px 12px 4px 12px; }
    .msg.bot { background: var(--surface-2); color: var(--text); align-self: flex-start; border-radius: 12px 12px 12px 4px; border: 0.5px solid var(--border); }
    .msg.thinking { opacity: .5; }
    .chat-bottom { border-top: 0.5px solid var(--border); padding: 1rem; }
    .chat-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .chat-input { flex: 1; padding: 10px 14px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; }
    .chat-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,.12); }
    .send-btn { padding: 10px 16px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 14px; }
    .send-btn:hover { background: #1b68c4; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; font-family: 'Inter', sans-serif; transition: background .12s; }
    .quick-btn:hover { background: var(--surface-2); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-3); }
    .empty-state svg { margin-bottom: 12px; opacity: .4; }
    .empty-state p { font-size: 14px; }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .two-col { grid-template-columns: 1fr; }
      main { padding: 1rem; }
      header { padding: 0 1rem; }
      nav { padding: 0 1rem; overflow-x: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    💳 Spending Tracker <span>/ Jorge Sanchez</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="status-pill" class="status-pill">Cargando...</span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
      ↺ Actualizar
    </button>
  </div>
</header>

<nav>
  <button class="nav-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
  <button class="nav-btn" onclick="switchTab('loans')">🤝 Préstamos</button>
  <button class="nav-btn" onclick="switchTab('ai')">🤖 AI Assistant</button>
</nav>

<main>
  <div id="pane-dashboard" class="pane active">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="two-col">
      <div class="card">
        <div class="card-title">Por tarjeta</div>
        <div id="chart-cards"></div>
      </div>
      <div class="card">
        <div class="card-title">Por categoría</div>
        <div id="chart-cats"></div>
      </div>
    </div>
    <div class="tx-wrap">
      <div class="tx-header">
        <h3 id="tx-title">Transacciones</h3>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Tarjeta</th><th>Merchant</th><th>Monto</th><th>Categoría</th></tr></thead>
        <tbody id="tx-body"></tbody>
      </table>
    </div>
  </div>

  <div id="pane-loans" class="pane">
    <div class="loans-header">
      <div class="loans-summary" id="loans-summary"></div>
      <button class="btn" onclick="showLoanForm()">+ Nuevo préstamo</button>
    </div>
    <div id="loan-form-wrap"></div>
    <div id="loans-list"></div>
  </div>

  <div id="pane-ai" class="pane">
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-bottom">
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" placeholder="Pregunta sobre tus gastos..." onkeydown="if(event.key==='Enter')sendChat()"/>
          <button class="send-btn" onclick="sendChat()">→</button>
        </div>
        <div class="quick-btns">
          <button class="quick-btn" onclick="setQ('¿Cuánto gasté este mes?')">¿Cuánto gasté este mes?</button>
          <button class="quick-btn" onclick="setQ('¿Cuál tarjeta usé más?')">¿Cuál tarjeta usé más?</button>
          <button class="quick-btn" onclick="setQ('¿Cuánto gasté en Amazon?')">¿Cuánto en Amazon?</button>
          <button class="quick-btn" onclick="setQ('¿Cuáles son mis suscripciones?')">Mis suscripciones</button>
          <button class="quick-btn" onclick="setQ('¿Cuánto debo cobrar en préstamos?')">¿Cuánto me deben?</button>
          <button class="quick-btn" onclick="setQ('Muéstrame mis gastos de viaje')">Gastos de viaje</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8hOgZLImVaVtpfNLDVxRtC9CSIkj6MpyGGV0UHDazDK5eAfFo7KoBD2tn7oxCpvXHTw/exec";
const ANTHROPIC_API = "https://api.anthropic.com/v1/messages";
const CARD_COLORS = ["#2a78d6","#1baf7a","#eda100","#4a3aa7","#e34948","#eb6834","#e87ba4","#008300"];
const CAT_COLORS = {"Subscriptions":"#2a78d6","Retail":"#1baf7a","Transfers":"#eda100","Restaurants":"#4a3aa7","Entertainment":"#e34948","Other":"#898781","Gas":"#eb6834","Groceries":"#008300","Travel":"#e87ba4","Health":"#d55181"};

let TX = [];
let LOANS = [];
let chatHistory = [];

const fmt = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const shortCard = s => s.replace("Capital One ","Cap1 ").replace("Bank of America","BofA").replace("Amex ","");
const badgeClass = cat => ({Transfers:"transfers",Restaurants:"restaurants",Retail:"retail",Entertainment:"entertainment"})[cat]||"";

async function loadLoans() {
  try {
    const res = await fetch(API_URL + "?action=getLoans");
    const data = await res.json();
    LOANS = data.loans || [];
  } catch { LOANS = []; }
  renderLoans();
}

async function saveLoans() {
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveLoans", loans: LOANS })
    });
  } catch(e) { console.error("Error saving loans:", e); }
}

async function loadData() {
  const btn = document.getElementById("refresh-btn");
  const pill = document.getElementById("status-pill");
  btn.classList.add("loading");
  btn.textContent = "↺ Cargando...";
  pill.textContent = "Cargando...";
  pill.className = "status-pill";
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    TX = data.transactions || [];
    pill.textContent = TX.length + " transacciones ✓";
    pill.className = "status-pill";
    renderDashboard();
    resetChat();
  } catch(e) {
    pill.textContent = "Error al cargar";
    pill.className = "status-pill error";
  }
  btn.classList.remove("loading");
  btn.textContent = "↺ Actualizar";
}

function switchTab(t) {
  document.querySelectorAll(".nav-btn").forEach((el,i) => {
    el.classList.toggle("active", ["dashboard","loans","ai"][i] === t);
  });
  document.querySelectorAll(".pane").forEach(el => el.classList.remove("active"));
  document.getElementById("pane-"+t).classList.add("active");
}

function renderDashboard() {
  if (!TX.length) return;

  const now = new Date();
  const curMonth = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonth = prevDate.getFullYear()+"-"+String(prevDate.getMonth()+1).padStart(2,"0");
  const curTx = TX.filter(t => t.date && t.date.startsWith(curMonth));
  const prevTx = TX.filter(t => t.date && t.date.startsWith(prevMonth));
  const totalCur = curTx.reduce((s,t)=>s+Number(t.amount),0);
  const totalPrev = prevTx.reduce((s,t)=>s+Number(t.amount),0);
  const allTotal = TX.reduce((s,t)=>s+Number(t.amount),0);
  const change = totalPrev > 0 ? ((totalCur-totalPrev)/totalPrev*100).toFixed(1) : null;
  const changeStr = change !== null ? (change > 0 ? "+" : "") + change + "%" : "—";
  const changeColor = change !== null && change > 0 ? "#e34948" : "#1baf7a";

  document.getElementById("stats-grid").innerHTML = `
    <div class="stat"><div class="stat-label">Este mes</div><div class="stat-value">${fmt(totalCur)}</div><div class="stat-sub">${curTx.length} transacciones</div></div>
    <div class="stat"><div class="stat-label">Mes anterior</div><div class="stat-value">${fmt(totalPrev)}</div><div class="stat-sub">${prevTx.length} transacciones</div></div>
    <div class="stat"><div class="stat-label">Cambio</div><div class="stat-value" style="color:${changeColor}">${changeStr}</div><div class="stat-sub">vs mes anterior</div></div>
    <div class="stat"><div class="stat-label">Total registrado</div><div class="stat-value">${fmt(allTotal)}</div><div class="stat-sub">${TX.length} transacciones</div></div>`;

  const byCard = Object.entries(TX.reduce((a,t)=>{a[t.card]=(a[t.card]||0)+Number(t.amount);return a},{})).sort((a,b)=>b[1]-a[1]);
  const byCat = Object.entries(TX.reduce((a,t)=>{a[t.category]=(a[t.category]||0)+Number(t.amount);return a},{})).sort((a,b)=>b[1]-a[1]);
  const maxCard = byCard[0]?byCard[0][1]:1;
  const maxCat = byCat[0]?byCat[0][1]:1;

  document.getElementById("chart-cards").innerHTML = byCard.map(([card,amt],i)=>`
    <div class="bar-row">
      <div class="bar-label" title="${card}">${shortCard(card)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxCard*100)}%;background:${CARD_COLORS[i%CARD_COLORS.length]}">
        <span class="bar-amount">${fmt(amt)}</span></div></div>
    </div>`).join("");

  document.getElementById("chart-cats").innerHTML = byCat.map(([cat,amt])=>`
    <div class="bar-row">
      <div class="bar-label">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxCat*100)}%;background:${CAT_COLORS[cat]||'#898781'}">
        <span class="bar-amount">${fmt(amt)}</span></div></div>
    </div>`).join("");

  document.getElementById("tx-title").textContent = `Todas las transacciones (${TX.length})`;
  const sorted = [...TX].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("tx-body").innerHTML = sorted.map(t=>`
    <tr>
      <td style="color:#898781;white-space:nowrap">${t.date?t.date.slice(5):""}</td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${shortCard(t.card)}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.merchant}</td>
      <td class="amount-cell ${t.accountType==="debit"?"debit-cell":""}">${fmt(t.amount)}</td>
      <td><span class="badge ${badgeClass(t.category)}">${t.category}</span></td>
    </tr>`).join("");
}

function renderLoans() {
  const pending = LOANS.filter(l=>l.status!=="pagado").reduce((s,l)=>s+Number(l.amount||0),0);
  const pendingCount = LOANS.filter(l=>l.status!=="pagado").length;
  document.getElementById("loans-summary").innerHTML = `<strong>${pendingCount}</strong> préstamos pendientes · Total: <strong>${fmt(pending)}</strong>`;

  if (!LOANS.length) {
    document.getElementById("loans-list").innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Sin préstamos registrados.</p></div>`;
    return;
  }

  document.getElementById("loans-list").innerHTML = LOANS.map(l => {
    const remaining = Number(l.amount||0) - Number(l.amountPaid||0);
    return `<div class="loan-card">
      <div class="loan-top">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span class="loan-name">${l.person}</span>
            <span class="status-badge status-${l.status}">${l.status==="pagado"?"Pagado":l.status==="parcial"?"Parcial":"Pendiente"}</span>
          </div>
          <div class="loan-meta">
            <span><strong>${fmt(l.amount)}</strong> prestado</span>
            ${Number(l.amountPaid)>0?`<span><strong>${fmt(l.amountPaid)}</strong> pagado</span>`:""}
            ${l.status!=="pagado"?`<span style="color:#a32d2d"><strong>${fmt(remaining)}</strong> pendiente</span>`:""}
            <span>Prestado: ${l.dateLent}</span>
            ${l.promisedDate?`<span>Prometió pagar: ${l.promisedDate}</span>`:""}
            ${l.paymentMethod?`<span>Via: ${l.paymentMethod}</span>`:""}
            ${l.notes?`<span style="font-style:italic">${l.notes}</span>`:""}
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-left:12px">
          <button class="btn btn-sm" onclick="editLoan('${l.id}')">✏️ Editar</button>
          <button class="btn btn-sm btn-danger" onclick="deleteLoan('${l.id}')">🗑 Borrar</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function showLoanForm(existing) {
  const l = existing || {person:"",amount:"",amountPaid:"0",dateLent:new Date().toISOString().slice(0,10),promisedDate:"",paymentMethod:"",status:"pendiente",notes:""};
  document.getElementById("loan-form-wrap").innerHTML = `
    <div class="form-card">
      <h3>${existing?"Editar préstamo":"Nuevo préstamo"}</h3>
      <div class="form-grid">
        <div class="form-group"><label>Persona</label><input id="f-person" value="${l.person}" placeholder="¿A quién le prestaste?"/></div>
        <div class="form-group"><label>Monto prestado</label><input id="f-amount" type="number" step="0.01" value="${l.amount}" placeholder="0.00"/></div>
        <div class="form-group"><label>Monto pagado</label><input id="f-paid" type="number" step="0.01" value="${l.amountPaid||0}"/></div>
        <div class="form-group"><label>Fecha prestado</label><input id="f-date" type="date" value="${l.dateLent}"/></div>
        <div class="form-group"><label>Fecha prometida</label><input id="f-promise" type="date" value="${l.promisedDate||""}"/></div>
        <div class="form-group"><label>Método de pago</label><input id="f-method" value="${l.paymentMethod||""}" placeholder="Zelle, efectivo, transferencia..."/></div>
        <div class="form-group"><label>Estado</label>
          <select id="f-status">
            <option value="pendiente" ${l.status==="pendiente"?"selected":""}>Pendiente</option>
            <option value="parcial" ${l.status==="parcial"?"selected":""}>Parcial</option>
            <option value="pagado" ${l.status==="pagado"?"selected":""}>Pagado</option>
          </select>
        </div>
        <div class="form-group"><label>Notas</label><input id="f-notes" value="${l.notes||""}" placeholder="Opcional..."/></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-sm" onclick="document.getElementById('loan-form-wrap').innerHTML=''">Cancelar</button>
        <button class="btn btn-sm" style="background:#0b0b0b;color:#fff;border-color:#0b0b0b" onclick="saveLoan('${existing?l.id:""}')">Guardar</button>
      </div>
    </div>`;
}

function editLoan(id) { showLoanForm(LOANS.find(l=>l.id===id)); }

function deleteLoan(id) {
  if (!confirm("¿Borrar este préstamo?")) return;
  LOANS = LOANS.filter(l=>l.id!==id);
  saveLoans(); renderLoans();
}

function saveLoan(existingId) {
  const loan = {
    id: existingId || Date.now().toString(),
    person: document.getElementById("f-person").value,
    amount: document.getElementById("f-amount").value,
    amountPaid: document.getElementById("f-paid").value || "0",
    dateLent: document.getElementById("f-date").value,
    promisedDate: document.getElementById("f-promise").value,
    paymentMethod: document.getElementById("f-method").value,
    status: document.getElementById("f-status").value,
    notes: document.getElementById("f-notes").value
  };
  if (existingId) { LOANS = LOANS.map(l=>l.id===existingId?loan:l); }
  else { LOANS.push(loan); }
  saveLoans();
  document.getElementById("loan-form-wrap").innerHTML = "";
  renderLoans();
}

function resetChat() {
  chatHistory = [{role:"assistant", text:`Hola Jorge! Tengo acceso a tus ${TX.length} transacciones. Pregúntame en español o inglés — por ejemplo: "¿Cuánto gasté este mes?" o "¿Cuánto me deben en préstamos?"`}];
  renderChat();
}

function renderChat() {
  const wrap = document.getElementById("chat-messages");
  wrap.innerHTML = chatHistory.map(m=>`<div class="msg ${m.role==="user"?"user":"bot"}">${m.text}</div>`).join("");
  wrap.scrollTop = wrap.scrollHeight;
}

function setQ(q) { document.getElementById("chat-input").value = q; }

async function sendChat() {
  const inp = document.getElementById("chat-input");
  const msg = inp.value.trim(); if (!msg) return;
  inp.value = "";
  chatHistory.push({role:"user", text:msg});
  renderChat();
  const wrap = document.getElementById("chat-messages");
  const thinking = document.createElement("div");
  thinking.className = "msg bot thinking"; thinking.textContent = "Pensando...";
  wrap.appendChild(thinking); wrap.scrollTop = wrap.scrollHeight;

  const hist = chatHistory.slice(1,-1).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
  const messages = [...hist, {role:"user", content:msg}];

  try {
    const params = new URLSearchParams({
      action: "chat",
      messages: JSON.stringify(messages)
    });
    const res = await fetch(API_URL + "?" + params.toString());
    const data = await res.json();
    thinking.remove();
    chatHistory.push({role:"assistant", text: data.content?.[0]?.text || "No pude procesar tu pregunta."});
  } catch {
    thinking.remove();
    chatHistory.push({role:"assistant", text:"Error de conexion. Intenta de nuevo."});
  }
  renderChat();
}

// Init
loadLoans();
loadData();
</script>
